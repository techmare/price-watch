name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "scraper/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PriceWatch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PriceWatch-apk
          path: PriceWatch.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Price Watch 1.0.${{ github.run_number }}
          body: Download **PriceWatch.apk** below on your Android phone and open it to install or update.
          files: PriceWatch.apk
          make_latest: true
