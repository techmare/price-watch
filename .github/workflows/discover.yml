name: Inspect midoxshop.ma

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scraper/discover.py"]

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scraper/discover.py
      - name: Save findings
        run: |
          git config user.name "price-watch-bot"
          git config user.email "price-watch-bot@users.noreply.github.com"
          git add data/debug
          git diff --cached --quiet && exit 0
          git commit -m "midoxshop.ma inspection"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
