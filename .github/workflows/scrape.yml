name: Daily price check

on:
  schedule:
    - cron: "17 5 * * *"   # about 6:17 in Morocco
  workflow_dispatch:
    inputs:
      sites:
        description: "Only these site ids (space separated), empty for all"
        required: false
  push:
    branches: [main]
    paths: ["scraper/**"]

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check prices
        run: python scraper/scrape.py ${{ github.event.inputs.sites }}
      - name: Save results
        run: |
          git config user.name "price-watch-bot"
          git config user.email "price-watch-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Prices $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
