name: Daily price check

on:
  # GitHub often starts scheduled runs hours late, so several start times are queued;
  # the first one that runs does the check, the others see it's done and stop.
  schedule:
    - cron: "41 22 * * *"   # 23:41 Morocco
    - cron: "13 1 * * *"    # 02:13
    - cron: "37 3 * * *"    # 04:37
    - cron: "17 5 * * *"    # 06:17
  workflow_dispatch:
    inputs:
      sites:
        description: "Only these site ids (space separated), empty for all"
        required: false
  push:
    branches: [main]
    paths: ["scraper/**"]

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Already checked today?
        id: done
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as dt
          from zoneinfo import ZoneInfo
          tz = ZoneInfo("Africa/Casablanca")
          # a check from 23:00 onwards counts for the next day
          day = lambda t: (t.astimezone(tz) + dt.timedelta(hours=1)).date()
          try:
              last = day(dt.datetime.fromisoformat(json.load(open("data/latest.json"))["generated"]))
          except Exception:
              last = None
          print("skip=" + ("true" if last == day(dt.datetime.now(dt.timezone.utc)) else "false"))
          PY
      - name: Check prices
        if: steps.done.outputs.skip != 'true'
        run: python scraper/scrape.py ${{ github.event.inputs.sites }}
      - name: Save results
        if: steps.done.outputs.skip != 'true'
        run: |
          git config user.name "price-watch-bot"
          git config user.email "price-watch-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Prices $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
